# 三个 AI 编程工具的安装路径，以及一键安装器（npx skills）认得的仓库布局。
# accepted_dirs：README 里该工具的小节写了其中任一条即达标。
platforms:
  claude_code:
    display: "Claude Code"
    accepted_dirs:                     # https://code.claude.com/docs/en/skills
      - "~/.claude/skills/"
      - ".claude/skills/"
  codex_cli:
    display: "Codex CLI"
    accepted_dirs:
      # https://learn.chatgpt.com/docs/build-skills ，https://github.com/vercel-labs/skills
      - "~/.agents/skills/"            # 用户级，官方文档与一键安装器一致
      - ".agents/skills/"              # 项目级
      - "~/.codex/skills/"             # 旧的用户级位置，Codex 仍然读
  opencode:
    display: "OpenCode"
    accepted_dirs:                     # https://opencode.ai/docs/skills/
      - "~/.config/opencode/skills/"
      - ".opencode/skills/"
      - "~/.agents/skills/"            # 以下四条是 OpenCode 兼容的其他位置
      - ".agents/skills/"              # 一键安装器的项目级位置
      - "~/.claude/skills/"
      - ".claude/skills/"
installer:
  # 来源：https://github.com/vercel-labs/skills
  layouts_recognized:
    - "SKILL.md"                         # 仓库根直接放
    - "skills/<name>/SKILL.md"           # 推荐；必须是复数 skills，单数 skill/ 安装器找不到
    - "skills/<cat>/<name>/SKILL.md"     # 分类合集
    - ".claude/skills/<name>/SKILL.md"   # 工具目录布局
  recommended_layout: "skills/<name>/SKILL.md"
